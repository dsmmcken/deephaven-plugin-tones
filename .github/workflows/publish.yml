name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/js/package-lock.json

      # setup.py's package_js step only packs an already-built src/js/dist —
      # it silently skips if dist is missing — so build the bundle first.
      - name: Build JS bundle
        working-directory: src/js
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the JS bundle made it into the wheel
        run: unzip -l dist/*.whl | grep -q '_js/dist/index.js'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
