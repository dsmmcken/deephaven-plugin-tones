<!doctype html>
<!--
  Tier-1 Harness — deephaven-plugin-tones E2E
  ============================================
  Loads the plugin's built CJS bundle the SAME way Deephaven does (via the
  adapter's `new Function(module, exports, require, text)` evaluation), then
  delivers events through the plugin's own `eventMapping` handler so tests drive
  the REAL ToneEngine over the real code path.

  window.__harness API (used by Playwright):
    - send(payload)   deliver one deephaven_plugin_tones.event
    - getHook()       → window.__deephavenTones snapshot
    - resetHook()     clear log + activeVoices
    - pluginInfo()    → { name, hasHandler, elementKeys } from the loaded bundle
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToneEngine harness</title>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
  </head>
  <body>
    <button id="trigger" style="padding: 8px 16px; font-size: 14px">
      Start Audio (gesture unlock)
    </button>

    <div id="status" style="margin-top: 8px; font-family: monospace">
      loading…
    </div>

    <script type="module">
      // Enable the (opt-in) audio-output probe in ToneEngine BEFORE the bundle's
      // first start(): it taps the master output with a Tone.Meter and exposes
      // window.__deephavenTones.getOutputLevel() (dBFS). Must be set before load.
      window.__deephavenTonesProbe = true;

      let adapter;
      try {
        adapter = await import("/adapter/engine-adapter.js");
      } catch (e) {
        document.getElementById("status").textContent =
          "adapter load error: " + e;
        console.error("[harness] adapter load error", e);
        throw e;
      }

      window.__harness = {
        send(payload) {
          return adapter.sendEvent(payload);
        },
        getHook() {
          return window.__deephavenTones;
        },
        resetHook() {
          // Clear the log/voice count between tests. Do NOT reset `started`:
          // the engine is a module-level singleton whose internal `started` flag
          // stays true after the first unlock, so flipping only the hook flag
          // would desync them (start() is a no-op once started).
          const h = window.__deephavenTones;
          if (h) {
            h.log = [];
            h.activeVoices = 0;
          }
        },
        pluginInfo() {
          return {
            name: adapter.PLUGIN_NAME,
            eventName: adapter.EVENT_NAME,
            hasHandler: typeof adapter.EVENT_HANDLER === "function",
            elementKeys: Object.keys(adapter.PLUGIN?.mapping ?? {}),
          };
        },
      };

      // A real user-gesture button (Playwright can click it) — clicking it sends a
      // play event so Tone.start() runs inside a trusted gesture.
      document.getElementById("trigger").addEventListener("click", () => {
        adapter.sendEvent({ op: "play", note: "C4", config: {} });
        document.getElementById("status").textContent =
          "gesture play dispatched";
      });

      window.__harnessReady = true;
      document.getElementById("status").textContent =
        "harness ready — plugin: " + adapter.PLUGIN_NAME;
      console.log(
        "[harness] ready; plugin:",
        adapter.PLUGIN_NAME,
        "handler:",
        typeof adapter.EVENT_HANDLER,
      );
    </script>
  </body>
</html>
